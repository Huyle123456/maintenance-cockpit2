_schema-version: 3.3.0
ID: ZPM_MAINTENANCE_COCKPIT
version: 1.0.0
description: "SAP CAP Maintenance Cockpit - SAP Build Work Zone Edition"

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/package-app.js

modules:
  # ---------------- BACKEND CAP SERVICE ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 1024M
      disk-quota: 2048M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ZPM_MAINTENANCE_COCKPIT-auth
      - name: ZPM_MAINTENANCE_COCKPIT-db

  # ---------------- HANA CLOUD DB DEPLOYER ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-db-deployer
    type: nodejs
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      health-check-type: none
      memory: 512M
    requires:
      - name: ZPM_MAINTENANCE_COCKPIT-db

  # ---------------- HTML5 APP REPOSITORY DEPLOYER (BUILD WORK ZONE) ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-app-deployer
    type: com.sap.application.content
    path: gen/app
    requires:
      - name: ZPM_MAINTENANCE_COCKPIT-html5-repo-host
        parameters:
          content-target: true

  # ---------------- DESTINATIONS FOR SAP BUILD WORK ZONE ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-destination-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: ZPM_MAINTENANCE_COCKPIT-destination
        parameters:
          content-target: true
      - name: ZPM_MAINTENANCE_COCKPIT-html5-repo-host
        parameters:
          service-key:
            name: ZPM_MAINTENANCE_COCKPIT-html5-repo-host-key
      - name: ZPM_MAINTENANCE_COCKPIT-auth
        parameters:
          service-key:
            name: ZPM_MAINTENANCE_COCKPIT-auth-key
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: ZPM_MAINTENANCE_COCKPIT_HTML5_REPO
              ServiceInstanceName: ZPM_MAINTENANCE_COCKPIT-html5-repo-host
              ServiceKeyName: ZPM_MAINTENANCE_COCKPIT-html5-repo-host-key
              sap.cloud.service: com.fsoft.zpmmaintenancecockpit
            - Name: ZPM_MAINTENANCE_COCKPIT_AUTH
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: ZPM_MAINTENANCE_COCKPIT-auth
              ServiceKeyName: ZPM_MAINTENANCE_COCKPIT-auth-key
              sap.cloud.service: com.fsoft.zpmmaintenancecockpit
          existing_destinations_policy: update

resources:
  # ---------------- XSUAA SECURITY SERVICE ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: zpm-maintenance-cockpit
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"

  # ---------------- HANA CLOUD DATABASE (HDI CONTAINER) ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ---------------- HTML5 APPLICATION REPOSITORY HOST ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ---------------- DESTINATION SERVICE ----------------
  - name: ZPM_MAINTENANCE_COCKPIT-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                Description: CAP Maintenance Backend Service
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: false
                HTML5.DynamicDestination: true
                sap.cloud.service: com.fsoft.zpmmaintenancecockpit
    requires:
      - name: srv-api
